spring.application.name=echo-backend
# Render injects PORT env var; default to 8080 for local development
server.port=${PORT:8080}

# Database configuration via environment variables (required for production).
# Render injects DATABASE_URL (postgres://...) for a linked database; prefer the
# explicit SPRING_DATASOURCE_URL when both are set. DataSourceConfig converts
# postgres:// and postgresql:// URLs to JDBC format.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/echo_dev}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:echo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:echo_password}
# Small default pool: managed free-tier PostgreSQL allows few connections.
# DataSourceConfig applies this (spring.datasource.hikari.* is not read there).
spring.datasource.pool-max-size=${DB_POOL_MAX:5}

# Schema is owned by Flyway (forward-only migrations); Hibernate must only
# verify that the entity model matches it, never alter it.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep a Hibernate session open for the whole request (OSIV).
spring.jpa.open-in-view=false

# Redis configuration (Phase 7.1a - for future use)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# JWT configuration (Phase 7.1a - foundation)
echo.jwt.issuer=${JWT_ISSUER:echo}
echo.jwt.audience=${JWT_AUDIENCE:echo-clients}
echo.jwt.access-ttl-seconds=${JWT_ACCESS_TTL:900}
echo.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL:2592000}
echo.jwt.key-id=${JWT_KID:key-1}
# Signing keys (Base64-encoded). Unused by current code (no token issuance yet);
# wired now so Phase 7 can rely on these names. Never commit values.
echo.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
echo.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}

# CORS configuration
echo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator health endpoint (used by Render health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Behind Render's router: honor X-Forwarded-Proto/For so absolute URLs,
# secure-cookie decisions, and CORS origin checks see the external scheme/host.
server.forward-headers-strategy=framework
# Drain in-flight requests on SIGTERM (Render redeploys) instead of cutting them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s