# ECHO — Render blueprint: backend web service only. Database is Neon-managed
# PostgreSQL, supplied as a dashboard secret (see SPRING_DATASOURCE_URL below).
# [ENG] Human-approved deploy slice (ADR-023). This does NOT close OPEN-07:
# production hardening (backups/PITR verification, observability, RPO/RTO)
# stays Phase 27 work.
#
# Apply: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets (SPRING_DATASOURCE_URL, JWT_PRIVATE_KEY_BASE64, JWT_PUBLIC_KEY_BASE64,
# CORS_ALLOWED_ORIGINS) are sync:false on purpose — paste real values in the
# dashboard, never in git.
#
# FREE-TIER WARNING [ASM]: verify Render's current free plans before relying on
# them — free web services sleep when idle (cold starts). No Render-managed
# database is declared here: Render free PostgreSQL expires 30 days after
# creation, which would violate the hard constraint "no trials/expiring tiers"
# (requirements §7.2), so the persistent store is Neon (no time expiry stated;
# verify quota at signup). Neon free-compute suspension preserves data.

services:
  - type: web
    name: echo-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Database: Neon-managed PostgreSQL, direct (non-pooler) connection URL,
      # pasted in the Render dashboard, e.g.
      # postgresql://<role>:<password>@<host>/<dbname>?sslmode=require
      # DataSourceConfig converts it to JDBC, reads credentials from the URL
      # userinfo, and fails fast when absent. No Render database is declared
      # in this blueprint; the previous Render free database (expiring tier)
      # must not be recreated as the permanent store.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseContainerSupport"
      - key: JWT_ISSUER
        value: echo
      - key: JWT_AUDIENCE
        value: echo-clients
      - key: JWT_KID
        value: key-1
      # Base64-encoded RSA keys (DER bytes, no PEM headers). Generate locally
      # with Git Bash / WSL, paste the single-line outputs in the dashboard:
      #   openssl genrsa -out private.pem 2048
      #   openssl pkcs8 -topk8 -inform PEM -in private.pem -outform DER -nocrypt | base64 -w0
      #     -> JWT_PRIVATE_KEY_BASE64 (PKCS#8, matches KeyRotationService)
      #   openssl rsa -in private.pem -pubout -outform DER | base64 -w0
      #     -> JWT_PUBLIC_KEY_BASE64 (X.509, matches KeyRotationService)
      # Unused by current code (no token issuance yet); required from Phase 7.
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      # Set AFTER the Vercel deploy, then redeploy this service, e.g.:
      # https://echo-web.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
